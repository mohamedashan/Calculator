<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>
        <div class="Calculator" id="Calculator">
            <div class="Screen" id="Screen"></div>
            <div class="Buttons" id="Buttons">
                <button class="Ac" id="Ac">AC</button>
                <button class="Del" id="Del">DEL</button>
                <button class="Divide" id="Divide">/</button>
                <button class="Mul" id="Mul">*</button>
                
                <button class="N7" id="N7" onclick="N7()">7</button>
                <button class="N8" id="N8">8</button>
                <button class="N9" id="N9">9</button>
                <button class="Minus" id="Minus">-</button>
                
                <button class="N4" id="N4">4</button>
                <button class="N5" id="N5">5</button>
                <button class="N6" id="N6">6</button>
                <button class="Sum" id="Sum">+</button>
                
                <button class="N1" id="N1">1</button>
                <button class="N2" id="N2">2</button>
                <button class="N3" id="N3">3</button>
                <button class="Equal" id="Equal">=</button>
                
                <button class="N0" id="N0">0</button>
                <button class="Dot" id="Dot">.</button>
            </div>
        </div>
    </center>
    <script src="script.js"></script>
</body>

</html>
